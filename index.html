#boot{position:fixed;inset:0;z-index:100;overflow:hidden;background:linear-gradient(180deg,#2a1240 0%,#7a2f5e 42%,#e0705a 68%,#ffb26b 82%,#1c0f2b 82.2%);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-family:Inter,system-ui,-apple-system,sans-serif;transition:opacity .7s ease}
#boot.out{opacity:0;pointer-events:none}
#boot .bt-sun{position:absolute;left:50%;bottom:16%;width:min(70vw,62vh,420px);aspect-ratio:1;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,#ffe29a 0%,#ffb35c 45%,rgba(255,120,90,0) 70%);animation:btSun 6s ease-in-out infinite alternate}

#boot .bt-far{animation:btPan 30s linear infinite alternate} #boot .bt-near{animation:btPan 18s linear infinite alternate-reverse}
#boot .bt-sea{position:absolute;left:0;right:0;bottom:0;height:16.2%;background:linear-gradient(180deg,#2b1638,#120a1c);}
#boot .bt-sea:before{content:"";position:absolute;left:50%;top:0;width:min(50vw,300px);height:100%;transform:translateX(-50%);background:repeating-linear-gradient(180deg,rgba(255,190,110,.55) 0 3px,transparent 3px 11px);mask:linear-gradient(180deg,#000,transparent);-webkit-mask:linear-gradient(180deg,#000,transparent);animation:btShim 2s linear infinite}
#boot .bt-in{position:relative;z-index:2;text-align:center;margin-bottom:22vh}
#boot .bt-k{font-size:12px;font-weight:900;letter-spacing:.32em;opacity:0;animation:btRise 1s .2s ease-out forwards}
#boot .bt-logo{font-size:clamp(70px,22vw,136px);font-weight:900;line-height:.86;letter-spacing:-.02em;margin-top:8px;text-shadow:0 0 18px rgba(255,138,92,.9),0 0 60px rgba(196,70,122,.8);opacity:0;animation:btSlam 1.1s .35s cubic-bezier(.2,1.4,.4,1) forwards}
#boot .bt-logo span{display:block;color:#ffd23f;text-shadow:0 0 18px rgba(255,210,63,.9),0 0 70px rgba(255,138,92,.8)}
#boot .bt-bar{width:min(240px,60vw);height:5px;border-radius:9px;background:rgba(255,255,255,.18);margin:26px auto 10px;overflow:hidden;opacity:0;animation:btRise .8s 1s ease-out forwards}
#boot .bt-bar i{display:block;height:100%;width:6%;border-radius:9px;background:linear-gradient(90deg,#ff8a5c,#ffd23f);box-shadow:0 0 12px #ffd23f;transition:width .5s ease}
#boot .bt-msg{font-size:13px;font-weight:800;opacity:0;animation:btRise .8s 1.1s ease-out forwards;text-shadow:0 2px 10px rgba(0,0,0,.5);min-height:1.2em}
@keyframes btSlam{from{opacity:0;transform:scale(1.6);filter:blur(8px);letter-spacing:.2em}to{opacity:1;transform:none;filter:none}}
@keyframes btRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes btPan{from{transform:translateX(0)}to{transform:translateX(-60px)}}
@keyframes btSun{from{transform:translateX(-50%) translateY(6%)}to{transform:translateX(-50%) translateY(-4%)}}
@keyframes btShim{from{background-position:0 0}to{background-position:0 22px}}
@media (orientation:landscape) and (max-height:540px){#boot .bt-in{margin-bottom:18vh} #boot .bt-logo{font-size:clamp(48px,13vh,90px)} #boot .bt-sky{height:30%} #boot .bt-sun{width:40vh;bottom:22%}}

<div id="custom" class="screen hidden">
  <div class="topbar">
    <button class="pill" id="backBtn">‹ Back</button>
    <h2 id="customTitle">Character</h2>
    <button class="pill" id="randBtn">Random</button>
  </div>
  <div class="panel scroll">
    <div class="presets" id="presets"></div>
    <div class="tabs" id="tabs"></div>
    <div class="content" id="content"></div>
    <div class="stats" id="stats"></div>
  </div>
  <div class="drag-hint">drag to rotate</div>
</div>

<!-- In-game HUD -->
<div id="hud" class="hidden">
  <div class="hud-l">
    <div class="hud-row"><div class="clock"><span id="clockIco"></span><span id="clockTxt">08:00</span></div><div class="money" id="moneyTxt">$0</div></div>
    <div id="subs" class="hidden"><div class="subFaceWrap"><canvas id="subFace" width="160" height="160"></canvas></div><span class="subIco" id="subIco"></span><div class="subBody"><b id="subName"></b><span id="subTxt"></span></div></div>
    <div class="toast" id="toast"></div>
    <div class="note hidden" id="note"><span class="nico" id="noteIco"></span><span class="nbody"><b id="noteT"></b><small id="noteS"></small></span></div>
    <div class="needs"><div class="need" id="nHunger"><svg viewBox="0 0 24 24" class="ic sm"><path d="M7 3v7M5 3v4.5a2 2 0 0 0 4 0V3M7 10v11M17 21V3c-2 1-3.5 4-3.5 8 0 1.4.6 2 1.6 2H17"/></svg><i></i></div><div class="need" id="nEnergy"><svg viewBox="0 0 24 24" class="ic sm"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg><i></i></div><div class="need" id="nMood"><svg viewBox="0 0 24 24" class="ic sm"><circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/></svg><i></i></div><div class="need" id="nBladder"><svg viewBox="0 0 24 24" class="ic sm"><path d="M8 3h6v6H8zM5 9h13a5 5 0 0 1-5 6H10a5 5 0 0 1-5-6zM10 15v5h4v-5"/></svg><i></i></div><div class="need" id="nHygiene"><svg viewBox="0 0 24 24" class="ic sm"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg><i></i></div></div>
    <div class="money-float" id="moneyFloat"></div>
    <div class="wanted" id="wantedHud"></div>
    <div class="zone" id="zoneTxt">Downtown</div>
    <div class="wp" id="wpTxt"></div>
    <button class="wpn" id="wpnBtn"></button>
  </div>
  <div id="mmWrap"><canvas id="minimap" width="300" height="400"></canvas><div id="mmNav" class="hidden"><b id="mmNavD"></b><small id="mmNavT"></small></div><div id="mmSpeed" class="hidden"><b id="mmSpeedN">0</b><small>mph</small></div></div>
  <div class="side-btns"><button class="sidebtn" id="phoneBtn" aria-label="Phone"><svg viewBox="0 0 24 24" class="ic"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg></button><button class="sidebtn hidden" id="radioBtn" aria-label="Radio"><svg viewBox="0 0 24 24" class="ic"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M7 8 17 3"/><circle cx="15" cy="14" r="3"/><path d="M6 12h3M6 16h3"/></svg></button><button class="sidebtn hidden love" id="loveBtn" aria-label="Date"><svg viewBox="0 0 24 24" class="ic"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg></button><button class="sidebtn hidden" id="editBtn" aria-label="Edit home"><svg viewBox="0 0 24 24" class="ic"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13 7 4 4"/></svg></button></div>
  <div id="editBar" class="hidden"><button class="pill" id="editAdd">Add from storage</button></div>
  <div class="race-txt hidden" id="raceTxt"></div>
</div>

<!-- Translucent controller -->
<div id="pad" class="hidden">
  <div class="speedo hidden" id="speedo"><b id="speedTxt">0</b><span>mph</span></div>
  <div id="stickZone">
    <div id="stickBase"><div id="stickKnob"></div></div>
    <div id="carLabel"></div>
  </div>
  <div class="face">
    <button class="fbtn y" id="btnY"></button>
    <button class="fbtn x" id="btnX"></button>
    <button class="fbtn b" id="btnB"></button>
    <button class="fbtn a" id="btnA"></button>
  </div>
</div>

<div id="phone" class="hidden">
  <div class="phone-stage"><div class="iphone">
    <div class="btn-side l1"></div><div class="btn-side l2"></div><div class="btn-side r1"></div>
    <div class="ph-screen">
      <div class="island"></div>
      <div class="ph-status"><span id="phTime">08:00</span><span class="ph-sig">5G <i class="bars"></i><i class="batt"></i></span></div>
      <div id="phApp" class="scroll"></div>
      <button class="homebar" id="phHome" aria-label="Close phone"></button>
    </div>
  </div></div>
</div>

<div id="talkUI" class="hidden">
  <div id="talkFlash"></div>
  <div class="talk-tag"><b id="talkName"></b><span id="talkTag"></span><div id="talkRel" class="talk-rel hidden"></div><div id="talkNeeds" class="talk-needs hidden"></div></div>
  <div class="talk-box" id="talkBox">
    <canvas id="talkFace" class="hidden" width="160" height="160"></canvas>
    <div class="talk-who" id="talkWho"></div>
    <div class="talk-text" id="talkText"></div>
    <div class="talk-more hidden" id="talkMore"></div>
    <div class="talk-opts hidden" id="talkOpts"></div>
  </div>
</div>

<div id="modal" class="screen hidden"><div class="card modal-card"><div id="modalBody"></div><div class="modal-btns" id="modalBtns"></div></div></div>

<div id="dealUI" class="screen hidden"><div class="deal-card scroll"><div class="deal-head"><b id="dealTitle">Trade</b><button class="pill" id="dealClose">Done</button></div><div id="dealBody"></div></div></div>

<div id="mg" class="screen hidden">
  <canvas id="mgCanvas"></canvas>
  <div class="mg-timer"><i id="mgTimer"></i></div>
  <div class="mg-head"><b id="mgTitle">Minigame</b><button class="pill" id="mgQuit">Quit</button></div>
  <div id="mgHint"></div><div id="mgBanner"></div>
  <div class="card mg-card hidden" id="mgCard"></div>
</div>

<div id="danceUI" class="hidden"><canvas id="danceCv"></canvas><button class="pill" id="danceQuit">Leave floor</button></div>
<div id="hurt"></div>
<div id="fxVig"></div>
<div id="fade"></div>
<div id="jailCut"><div><b></b><i></i><span></span></div></div>
<div id="deathScreen"><div><b>You blacked out</b><span>Waking up at Bay General…</span></div></div>


<script type="module" src="js/main.js?v=200"></script>
</body>
</html>
