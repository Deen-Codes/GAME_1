<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bay City">
<meta name="theme-color" content="#141a30">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>Bay City</title>
<link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>
<canvas id="c"></canvas>

<!-- Customiser (character / gunsmith / garage) -->
<div id="custom" class="screen hidden">
  <div class="topbar">
    <button class="pill" id="backBtn">‹ Back</button>
    <h2 id="customTitle">Character</h2>
    <button class="pill" id="randBtn">🎲 Random</button>
  </div>
  <div class="panel scroll">
    <div class="presets" id="presets"></div>
    <div class="tabs" id="tabs"></div>
    <div class="content" id="content"></div>
    <div class="stats" id="stats"></div>
  </div>
  <div class="drag-hint">drag to rotate</div>
</div>

<!-- In-game HUD -->
<div id="hud" class="hidden">
  <div class="hud-l">
    <div class="clock" id="clockTxt">☀ 08:00</div>
    <div class="zone" id="zoneTxt">Downtown</div>
    <div class="ammo" id="ammoTxt"></div>
  </div>
  <canvas id="minimap" width="240" height="240"></canvas>
  <div class="speedo hidden" id="speedo"><b id="speedTxt">0</b><span>km/h</span></div>
  <div class="toast" id="toast"></div>
</div>

<!-- Translucent controller -->
<div id="pad" class="hidden">
  <div id="stickZone">
    <div id="stickBase"><div id="stickKnob"></div></div>
  </div>
  <div class="face">
    <button class="fbtn y" id="btnY"></button>
    <button class="fbtn x" id="btnX"></button>
    <button class="fbtn b" id="btnB"></button>
    <button class="fbtn a" id="btnA"></button>
  </div>
</div>

<div id="mapView" class="screen hidden">
  <canvas id="bigmap"></canvas>
  <div class="map-actions">
    <button class="mbtn" id="mCharBtn"><i>👤</i>Character</button>
    <button class="mbtn" id="mGunBtn"><i>🔫</i>Gunsmith</button>
    <button class="mbtn" id="mCarBtn"><i>🚗</i>Garage</button>
    <button class="mbtn" id="mBringBtn"><i>📍</i>Bring car</button>
  </div>
  <button class="big" id="mapClose">Back to the city</button>
  <div class="map-hint" id="mapHint"></div>
</div>

<div id="hurt"></div>
<div id="deathScreen"><div><b>You blacked out</b><span>Waking up at Downtown Clinic…</span></div></div>

<div id="rotate"><div>↻<br>Turn your phone upright<br><small>Bay City is played in portrait</small></div></div>

<script type="module" src="js/main.js?v=3"></script>
</body>
</html>
