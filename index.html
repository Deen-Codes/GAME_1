<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bay City">
<meta name="theme-color" content="#141a30">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>Bay City</title>
<link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
<canvas id="c"></canvas>

<!-- Main menu -->
<div id="menu" class="screen">
  <h1>BAY<span>CITY</span></h1>
  <div class="menu-col">
    <button class="big" id="playBtn">▶ Play</button>
    <div class="menu-row">
      <button class="mid" id="charBtn">Character</button>
      <button class="mid" id="gunBtn">Gunsmith</button>
      <button class="mid" id="carBtn">Garage</button>
    </div>
    <div class="tip" id="tipTxt"></div>
    <div class="tip ver">v2</div>
  </div>
</div>

<!-- Customiser (character / gunsmith / garage) -->
<div id="custom" class="screen hidden">
  <div class="topbar">
    <button class="pill" id="backBtn">‹ Back</button>
    <h2 id="customTitle">Character</h2>
    <button class="pill" id="randBtn">🎲 Random</button>
  </div>
  <div class="panel scroll">
    <div class="presets" id="presets"></div>
    <div class="tabs" id="tabs"></div>
    <div class="content" id="content"></div>
    <div class="stats" id="stats"></div>
  </div>
  <div class="drag-hint">drag to rotate</div>
</div>

<!-- In-game HUD -->
<div id="hud" class="hidden">
  <div class="hud-l">
    <div class="clock" id="clockTxt">☀ 08:00</div>
    <div class="zone" id="zoneTxt">Downtown</div>
    <div class="ammo" id="ammoTxt"></div>
  </div>
  <canvas id="minimap" width="240" height="240"></canvas>
  <div class="speedo hidden" id="speedo"><b id="speedTxt">0</b><span>km/h</span></div>
  <div class="toast" id="toast"></div>
</div>

<!-- Translucent controller -->
<div id="pad" class="hidden">
  <div id="stickZone">
    <div id="stickBase"><div id="stickKnob"></div></div>
  </div>
  <div class="mid-btns">
    <button class="sbtn" id="btnMap">MAP</button>
    <button class="sbtn" id="btnPause">☰</button>
  </div>
  <div class="face">
    <button class="fbtn y" id="btnY"><b>Y</b><span id="lblY">Reload</span></button>
    <button class="fbtn x" id="btnX"><b>X</b><span id="lblX">Fire</span></button>
    <button class="fbtn b" id="btnB"><b>B</b><span id="lblB">Jump</span></button>
    <button class="fbtn a" id="btnA"><b>A</b><span id="lblA">—</span></button>
  </div>
</div>

<div id="mapView" class="screen hidden"><canvas id="bigmap"></canvas><div class="map-hint">tap to close</div></div>

<div id="pause" class="screen hidden"><div class="card">
  <h2>Paused</h2>
  <button class="big" id="resumeBtn">Resume</button>
  <button class="mid" id="callCarBtn">🚗 Bring my car here</button>
  <button class="mid" id="quitBtn">Main menu</button>
  <div class="tip">Progress saves automatically.</div>
</div></div>

<div id="rotate"><div>↻<br>Turn your phone upright<br><small>Bay City is played in portrait</small></div></div>

<script type="module" src="js/main.js?v=2"></script>
</body>
</html>
