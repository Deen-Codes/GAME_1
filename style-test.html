<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bay City Style Test</title>
<style>
  html, body { margin: 0; height: 100%; background: #cfe0ef; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; }
  canvas { display: block; touch-action: none; }
  #tag { position: fixed; left: 12px; top: 12px; right: 12px; color: #1b2430; font-weight: 700; font-size: 14px; text-shadow: 0 1px 0 #fff8; pointer-events: none; }
  #tag small { display: block; font-weight: 500; opacity: .75; }
  #bar { position: fixed; left: 0; right: 0; bottom: 14px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; padding: 0 12px; }
  #bar button { border: 0; border-radius: 999px; padding: 9px 14px; font: 600 13px system-ui; background: #ffffffd9; color: #1b2430; box-shadow: 0 2px 8px #0002; }
  #bar button.on { background: #1b2430; color: #fff; }
</style>
</head>
<body>
<div id="tag">Bay City: smooth style test<small>Drag to look around, pinch or scroll to zoom</small></div>
<div id="bar"></div>
<script type="module">
import * as THREE from './lib/three.module.min.js';
import { buildSmoothCar, buildSmoothPerson, buildSmoothGun, buildStreet, smoothLighting, SMOOTH_CARS } from './js/smooth.js';

const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setPixelRatio(Math.min(2, devicePixelRatio)); document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(40, 1, 0.1, 600);
smoothLighting(renderer, scene);
scene.add(buildStreet());

// four made-up lookalikes parked along the kerb
const cars = [['gulf', '#2f6fd6', -9], ['bavaria', '#1d1f24', -3.2], ['ranger', '#e9e6df', 3.2], ['volta', '#8c2a2a', 9.4]].map(([k, c, x]) => {
  const car = buildSmoothCar(k, c); car.position.set(x, 0, -3.3); car.rotation.y = Math.PI / 2; scene.add(car); return car; });
cars[0].userData.doors[1].rotation.y = -1.0; // one door open, to show it's a real hinged part

// you, with a pistol, and someone leaning by the shop
const me = buildSmoothPerson({ top: '#2f6fd6', pants: '#2a2d36', skin: '#c98f62', hair: '#2a1a10' }); me.root.position.set(-6.2, 0.15, -6.0); me.root.rotation.y = 0.35; scene.add(me.root);
me.armR.pivot.rotation.set(-1.45, 0.15, 0.05); me.armR.elbow.rotation.x = -0.08; me.armL.pivot.rotation.set(-1.3, -0.5, -0.1); me.armL.elbow.rotation.x = -0.35; me.head.rotation.y = 0.12;
const gun = buildSmoothGun(); me.armR.hand.add(gun);
// barrel along the forearm (the hand's -y), grip down through the palm: then slide it so the grip sits in the hand
gun.rotation.set(Math.PI / 2, 0, 0); gun.updateMatrix(); { const g = gun.userData.parts.grip.position.clone().applyMatrix4(new THREE.Matrix4().makeRotationFromEuler(gun.rotation)); gun.position.set(-g.x, -0.05 - g.y, -g.z); }
const her = buildSmoothPerson({ top: '#d9a03b', pants: '#3a4a6a', skin: '#7a4b30', hair: '#141414', shoes: '#c23b3b' }); her.root.position.set(1.0, 0.15, -8.6); her.root.rotation.y = 0.2; scene.add(her.root);
her.legR.pivot.rotation.x = 0.12; her.legL.pivot.rotation.x = -0.12; her.armL.pivot.rotation.set(0.1, 0, 0.12); her.armR.pivot.rotation.set(-0.5, 0, -0.35); her.armR.elbow.rotation.x = -1.6; her.head.rotation.y = -0.3;

// orbit camera: drag to turn, pinch or wheel to zoom
const V = { yaw: 0.55, pitch: 0.32, dist: 13, tx: -3, ty: 1.2, tz: -4.5 };
const views = { Street: { yaw: 0.55, pitch: 0.32, dist: 13, tx: -3, ty: 1.2, tz: -4.5 }, Cars: { yaw: 0.15, pitch: 0.18, dist: 14, tx: 0, ty: 0.9, tz: -3.3 }, Character: { yaw: 0.6, pitch: 0.1, dist: 3.4, tx: -6.2, ty: 1.3, tz: -6 }, 'Gun hand': { yaw: 1.2, pitch: 0.15, dist: 1.3, tx: -6.0, ty: 1.45, tz: -5.5 } };
const bar = document.getElementById('bar'); for (const k of Object.keys(views)) { const b = document.createElement('button'); b.textContent = k; b.onclick = () => { Object.assign(V, views[k]); bar.querySelectorAll('button').forEach(q => q.classList.toggle('on', q === b)); }; bar.appendChild(b); }
for (const k of Object.keys(SMOOTH_CARS)) { const i = Object.keys(SMOOTH_CARS).indexOf(k), b = document.createElement('button'); b.textContent = SMOOTH_CARS[k].name; b.onclick = () => { const c = cars.find(q => q.userData.kind === k); Object.assign(V, { yaw: 0.75, pitch: 0.2, dist: 7.5, tx: c.position.x, ty: 0.8, tz: c.position.z }); bar.querySelectorAll('button').forEach(q => q.classList.toggle('on', q === b)); }; bar.appendChild(b); }
const pts = new Map(); let pinch = 0;
renderer.domElement.addEventListener('pointerdown', e => { pts.set(e.pointerId, [e.clientX, e.clientY]); renderer.domElement.setPointerCapture(e.pointerId); });
renderer.domElement.addEventListener('pointermove', e => { const p = pts.get(e.pointerId); if (!p) return;
  if (pts.size === 1) { V.yaw -= (e.clientX - p[0]) * 0.006; V.pitch = Math.max(0.02, Math.min(1.3, V.pitch + (e.clientY - p[1]) * 0.005)); }
  pts.set(e.pointerId, [e.clientX, e.clientY]); if (pts.size === 2) { const [a, b] = [...pts.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]); if (pinch) V.dist = Math.max(1, Math.min(40, V.dist * pinch / d)); pinch = d; } });
const up = e => { pts.delete(e.pointerId); if (pts.size < 2) pinch = 0; }; renderer.domElement.addEventListener('pointerup', up); renderer.domElement.addEventListener('pointercancel', up);
renderer.domElement.addEventListener('wheel', e => { V.dist = Math.max(1, Math.min(40, V.dist * (1 + e.deltaY * 0.001))); e.preventDefault(); }, { passive: false });

const C = { ...V }; let t0 = performance.now();
function frame(now) { const dt = Math.min(0.05, (now - t0) / 1000); t0 = now; const k = 1 - Math.exp(-dt * 6); for (const key in V) C[key] += (V[key] - C[key]) * k;
  const W = innerWidth, H = innerHeight; if (renderer.domElement.width !== Math.floor(W * renderer.getPixelRatio())) { renderer.setSize(W, H); cam.aspect = W / H; cam.updateProjectionMatrix(); }
  cam.position.set(C.tx + Math.sin(C.yaw) * Math.cos(C.pitch) * C.dist, C.ty + Math.sin(C.pitch) * C.dist, C.tz + Math.cos(C.yaw) * Math.cos(C.pitch) * C.dist); cam.lookAt(C.tx, C.ty, C.tz);
  her.head.rotation.y = -0.3 + Math.sin(now / 1400) * 0.25; me.mouth.scale.y = 1;
  renderer.render(scene, cam); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
window.__style = { V, views, cars };
</script>
</body>
</html>
